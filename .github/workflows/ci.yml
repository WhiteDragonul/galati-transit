name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verificare tipuri
        run: npm run typecheck
      - name: Teste (potrivirea stațiilor)
        run: npm test
      - name: Verificare date (consistență internă, fără site-ul live)
        run: npm run data:verify -- --offline
      - name: Build
        run: npx vite build
